_target_: flash_chord.configuration.make_fixed_curriculum

# Same VOC / reset fractions as recon_body_flash_sac, compressed from 350M to
# 16,777,216 env steps so 30 Track-2 episodes can finish on one GPU.
# Zero VOC still begins at 60%; mixed starts at 82.5% / 87.5%.
thresholds: [1677741, 3355482, 5033126, 6710867, 8388608, 10066349, 13841218, 14680089, 16777216]

stages:
  - _target_: flash_chord.configuration.make_curriculum_stage
    voc_scale: 1.0
    objective_weights: &recon_body_weights
      termination: -300.0
      action_rate_l2: -0.0001
      action_l2: -0.000001
      soft_joint_limit: -0.001
      pelvis_position: 1.0
      pelvis_orientation: 1.0
      body_joint_position: 5.0
      object_position: 1.0
      object_orientation: 0.0
      progress: 1.0
      palm_position: 1.0
      palm_orientation: 1.0
      force_closure: 5.0
  - _target_: flash_chord.configuration.make_curriculum_stage
    voc_scale: 0.75
    objective_weights: *recon_body_weights
  - _target_: flash_chord.configuration.make_curriculum_stage
    voc_scale: 0.5
    objective_weights: *recon_body_weights
  - _target_: flash_chord.configuration.make_curriculum_stage
    voc_scale: 0.25
    objective_weights: *recon_body_weights
  - _target_: flash_chord.configuration.make_curriculum_stage
    voc_scale: 0.1
    objective_weights: *recon_body_weights
  - _target_: flash_chord.configuration.make_curriculum_stage
    voc_scale: 0.05
    objective_weights: *recon_body_weights
  - _target_: flash_chord.configuration.make_curriculum_stage
    voc_scale: 0.0
    objective_weights: *recon_body_weights
  - _target_: flash_chord.configuration.make_curriculum_stage
    voc_scale: 0.0
    objective_weights: *recon_body_weights
    immediate_first_frame_probability: 0.25
  - _target_: flash_chord.configuration.make_curriculum_stage
    voc_scale: 0.0
    objective_weights: *recon_body_weights
    immediate_first_frame_probability: 0.50
